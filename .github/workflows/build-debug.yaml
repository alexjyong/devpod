name: Build Debug (Unsigned)
on:
  workflow_dispatch:
    inputs:
      os_selection:
        description: 'Select OS to build for'
        required: true
        type: choice
        options:
          - all
          - macos-intel
          - macos-arm
          - windows
          - linux

jobs:
  build-app:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
            cli_only: false
            platform: macos-intel
          - host: macos-latest
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
            cli_only: false
            platform: macos-arm
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            cli_only: false
            platform: windows
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
            cli_only: false
            platform: linux
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    if: ${{ github.event.inputs.os_selection == 'all' || github.event.inputs.os_selection == matrix.settings.platform }}
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version (Debug)
        if: matrix.settings.cli_only == false
        run: yarn version --new-version 0.0.0-debug --no-git-tag-version
        working-directory: "./desktop"

      - name: Setup System Dependencies
        if: matrix.settings.host == 'ubuntu-22.04' && matrix.settings.cli_only == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        if: matrix.settings.cli_only == false
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        if: matrix.settings.cli_only == false
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build Sidecar CLI
        if: matrix.settings.host != 'windows-latest'
        run: |
          BIN_NAME=devpod-cli-${{ matrix.settings.target }}
          GOOS=${{ matrix.settings.os }} GOARCH=${{ matrix.settings.arch }} CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test/$BIN_NAME"
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/$BIN_NAME"
          ls desktop/src-tauri/bin

      - name: Build Sidecar CLI
        if: matrix.settings.host == 'windows-latest'
        shell: cmd
        run: |
          set GOOS=windows
          set GOARCH=${{ matrix.settings.arch }}
          set BIN_NAME=devpod-cli-${{ matrix.settings.target }}.exe

          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test\%BIN_NAME%"

          xcopy /F /Y "test\%BIN_NAME%" desktop\src-tauri\bin\*

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        if: matrix.settings.cli_only == false
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        if: matrix.settings.cli_only == false
        run: yarn install
        working-directory: "./desktop"

      - name: Install additional ubuntu dependencies
        if: matrix.settings.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Build Desktop App (Linux - Unsigned)
        if: matrix.settings.host == 'ubuntu-22.04' && matrix.settings.cli_only == false
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target ${{ matrix.settings.target }} --bundles appimage,deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # AppImage Signing (disabled):
          # SIGN: ${{ secrets.APP_IMAGE_SIGN }}
          # SIGN_KEY: ${{ secrets.APP_IMAGE_SIGN_KEY }}
          # APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APP_IMAGE_SIGN_PASSPHRASE }}

      - name: Build Desktop App (macOS - Unsigned)
        if: matrix.settings.host == 'macos-latest' && matrix.settings.cli_only == false
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target ${{ matrix.settings.target }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # MacOS Signing (disabled):
          # ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CI: false

      - name: Build Desktop App (Windows - Unsigned)
        if: matrix.settings.host == 'windows-latest' && matrix.settings.cli_only == false
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target ${{ matrix.settings.target }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Windows Code Signing (disabled):
          # CODESIGNTOOL_USERNAME: ${{ secrets.CODESIGNTOOL_USERNAME }}
          # CODESIGNTOOL_PASSWORD: ${{ secrets.CODESIGNTOOL_PASSWORD }}
          # CODESIGNTOOL_TOTP_SECRET: ${{ secrets.CODESIGNTOOL_TOTP_SECRET }}
          # CODESIGNTOOL_CREDENTIAL_ID: ${{ secrets.CODESIGNTOOL_CREDENTIAL_ID }}

      # Skip Windows binary signing
      # - name: Sign Windows Sidecar Binary
      #   if: matrix.settings.host == 'windows-latest'
      #   ...

      - name: Upload Build Artifacts (Windows)
        if: matrix.settings.host == 'windows-latest'
        uses: actions/upload-artifact@v3
        with:
          name: devpod-windows-${{ matrix.settings.arch }}-debug
          path: |
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload Build Artifacts (macOS)
        if: matrix.settings.host == 'macos-latest'
        uses: actions/upload-artifact@v3
        with:
          name: devpod-macos-${{ matrix.settings.arch }}-debug
          path: |
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/macos/*.app
          retention-days: 7

      - name: Upload Build Artifacts (Linux)
        if: matrix.settings.host == 'ubuntu-22.04'
        uses: actions/upload-artifact@v3
        with:
          name: devpod-linux-${{ matrix.settings.arch }}-debug
          path: |
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/deb/*.deb
          retention-days: 7
