name: Build Debug (Unsigned)
on:
  workflow_dispatch:
    inputs:
      build_macos_intel:
        description: 'Build macOS Intel'
        type: boolean
        default: true
      build_macos_arm:
        description: 'Build macOS ARM'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true 

jobs:
  build-macos-intel:
    if: ${{ github.event.inputs.build_macos_intel == 'true' }}
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version (Debug)
        run: yarn version --new-version 0.0.0-debug --no-git-tag-version
        working-directory: "./desktop"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build Sidecar CLI
        run: |
          BIN_NAME=devpod-secrets-cli-x86_64-apple-darwin
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test/$BIN_NAME"
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/$BIN_NAME"
          # Create the generic name that Tauri expects
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/devpod-secrets-cli"
          
          # Build Linux binaries for agent injection
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop/src-tauri/bin/devpod-secrets-cli-linux-amd64"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop/src-tauri/bin/devpod-secrets-cli-linux-arm64"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Build Desktop App (macOS - Unsigned)
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target x86_64-apple-darwin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devpod-macos-amd64-debug
          path: |
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          retention-days: 7

  build-macos-arm:
    if: ${{ github.event.inputs.build_macos_arm == 'true' }}
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version (Debug)
        run: yarn version --new-version 0.0.0-debug --no-git-tag-version
        working-directory: "./desktop"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build Sidecar CLI
        run: |
          BIN_NAME=devpod-secrets-cli-aarch64-apple-darwin
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test/$BIN_NAME"
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/$BIN_NAME"
          # Create the generic name that Tauri expects
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/devpod-secrets-cli"
          
          # Build Linux binaries for agent injection
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop/src-tauri/bin/devpod-secrets-cli-linux-amd64"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop/src-tauri/bin/devpod-secrets-cli-linux-arm64"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Build Desktop App (macOS - Unsigned)
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target aarch64-apple-darwin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devpod-macos-arm64-debug
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          retention-days: 7

  build-windows:
    if: ${{ github.event.inputs.build_windows == 'true' }}
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version (Debug)
        run: yarn version --new-version 0.0.0-debug --no-git-tag-version
        working-directory: "./desktop"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build Sidecar CLI
        shell: cmd
        run: |
          set GOOS=windows
          set GOARCH=amd64
          set BIN_NAME=devpod-secrets-cli-x86_64-pc-windows-msvc.exe
          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test\%BIN_NAME%"
          xcopy /F /Y "test\%BIN_NAME%" desktop\src-tauri\bin\*
          copy "test\%BIN_NAME%" "desktop\src-tauri\bin\devpod-secrets-cli.exe"
          
          REM Build Linux binaries for agent injection
          set GOOS=linux
          set GOARCH=amd64
          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop\src-tauri\bin\devpod-secrets-cli-linux-amd64"
          set GOARCH=arm64
          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "desktop\src-tauri\bin\devpod-secrets-cli-linux-arm64"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Build Desktop App (Windows - Unsigned)
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target x86_64-pc-windows-msvc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devpod-windows-amd64-debug
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 7

  build-linux:
    if: ${{ github.event.inputs.build_linux == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version (Debug)
        run: yarn version --new-version 0.0.0-debug --no-git-tag-version
        working-directory: "./desktop"

      - name: Setup System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build Sidecar CLI
        run: |
          BIN_NAME=devpod-secrets-cli-x86_64-unknown-linux-gnu
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v0.0.0-debug" -o "test/$BIN_NAME"
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/$BIN_NAME"
          # Create the generic name that Tauri expects
          cp "test/$BIN_NAME" "desktop/src-tauri/bin/devpod-secrets-cli"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Install additional ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Build Desktop App (Linux - Unsigned)
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: "./desktop"
          args: "--config src-tauri/tauri-debug.conf.json --target x86_64-unknown-linux-gnu --bundles appimage,deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devpod-linux-amd64-debug
          path: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          retention-days: 7
